name: PR validation

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            src/requirements.txt

      - name: Install Python application and test dependencies
        run: python -m pip install -r src/requirements.txt -r requirements-test.txt

      - name: Compile Python
        run: python -m compileall -q src

      - name: Run Python tests with branch coverage
        run: >-
          python -m pytest
          --cov=src --cov-branch --cov-fail-under=95
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --junitxml=test-results.xml

      - name: Upload Python test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: node --check src/static/app.js

      - name: Run frontend tests
        run: npm run test:ci

      - name: Upload frontend test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend-test-results.xml
          if-no-files-found: warn
          retention-days: 14
